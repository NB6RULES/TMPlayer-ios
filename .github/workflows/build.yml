name: Build iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate
      working-directory: TMPlayer-iOS

    - name: Build App
      run: |
        xcodebuild clean build \
          -project TMPlayer.xcodeproj \
          -scheme TMPlayer \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR=build
      working-directory: TMPlayer-iOS

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r TMPlayer-iOS/build/TMPlayer.app Payload/
        zip -r TMPlayer.ipa Payload
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TMPlayer-iOS
        path: TMPlayer.ipa
